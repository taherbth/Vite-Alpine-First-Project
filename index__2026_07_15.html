<!DOCTYPE html>
<html lang="en">
  <head>    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('_x_app-theme');           
            if (savedTheme === '"dark"' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('bg-gray-900', 'text-white');
            } else {
                document.documentElement.classList.remove('bg-gray-900','text-white');
            }
        })();
    </script>     
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Select2 CSS Layout Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css" type="text/css" media="screen" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"> 
    <title>Vite + Tailwind + Alpine</title>
  </head>

  <!-- FIX 1: x-data="navigation" moved here from the nested inner nav.
       The body is now the single Alpine root for the whole page. -->
  <body x-data="navigation"
        class="fixed-header"
        :class="{          
          'sidebar-collapsed': sidebarCollapsed
        }">

    <div class="fixed bottom-4 right-4 z-50 space-y-2">
        <template x-for="toast in $store.app.toasts" :key="toast.id">
            <div :class="toast.type === 'success' ? 'bg-green-500' : 'bg-red-500'" class="text-white p-4 rounded shadow-lg">
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- BEGIN SIDEBAR PANEL -->
    <!-- FIX 2: .page-sidebar stays as-is (pages.css targets this class).
         The old nested <nav x-data="navigation"> is completely removed. -->
    <nav class="page-sidebar" data-pages="sidebar">
        <!-- BEGIN SIDEBAR MENU TOP TRAY CONTENT -->
        <!-- div class="sidebar-overlay-slide from-top">
            <div class="row">
                <div class="col-xs-6 no-padding">
                    <a href="#" class="p-l-40">
                        <img src="/images/social_app.svg" alt="social" width="78" height="22">
                    </a>
                </div>
                <div class="col-xs-6 no-padding">
                    <a href="#" class="p-l-10"></a>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-6 m-t-20 no-padding">
                    <a href="#" class="p-l-40">
                        <img src="/images/calendar_app.svg" alt="calendar">
                    </a>
                </div>
                <div class="col-xs-6 m-t-20 no-padding">
                    <a href="#" class="p-l-10">
                        <img src="/images/add_more.svg" alt="add more">
                    </a>
                </div>
            </div>
        </div> -->
        <!-- END SIDEBAR MENU TOP TRAY CONTENT -->

        <!-- BEGIN SIDEBAR MENU HEADER -->
        <div class="sidebar-header">
            <img src="/images/logo_white.png" alt="logo" class="brand" width="78" height="22">            
        </div>
        <!-- END SIDEBAR MENU HEADER -->

        <!-- BEGIN SIDEBAR MENU -->
        <!-- FIX 4: Plain .sidebar-menu div — no x-data, no x-cloak anywhere.
             Alpine directives work because <body> is the x-data root.
             Sub-menu visibility is controlled entirely by li.open CSS rule in main.css. -->
            <div class="sidebar-menu" >
                <!-- injected by nav.js init() -->
            </div>
        <!-- END SIDEBAR MENU -->

    </nav>
    <!-- END SIDEBAR PANEL -->

    <!-- START PAGE CONTAINER -->
    <div class="page-container" style="padding-left:0px">
        <!-- START HEADER -->
        <div class="header" style="position: relative;">
            <button @click="toggleSidebar()" 
                    type="button"
                    class="btn-sidebar-toggle"
                    style="position: absolute !important;
                           left: 20px !important;
                           top: 50% !important;
                           transform: translateY(-50%) !important;
                           display: inline-block !important; 
                           visibility: visible !important; 
                           background: transparent; 
                           border: none; 
                           cursor: pointer; 
                           padding: 5px; 
                           z-index: 9999; 
                           color: #333; /* Dark color so it stands out on the white header background */
                           line-height: 1;">
                <i class="bi bi-list" style="font-size: 2rem !important; display: inline-block !important;"></i>
            </button>

            <div class="pull-left text-center font-montserrat text-uppercase demo-fs-23 header-text-class" 
                 style="padding-left: 45px !important;"> 
                XYZ Company          
            </div>
            <div class="pull-right user-info" style="width:30%">
                <div class="visible-lg visible-md m-t-10">        
                    <div class="pull-left p-r-10 p-t-10 fs-16 font-heading" style="padding-left:40%">
                        <h3 class="font-montserrat no-margin text-uppercase demo-fs-23"></h3>
                        <span class="semi-bold">ABU TAHER</span>
                    </div>
                    <div class="dropdown pull-right">       
                        <ul class="navbar-nav ml-auto py-4 py-md-0">
                            <li class="subnav nav-item pl-4 pl-md-0 ml-0 ml-md-4">
                                <button class="profile-dropdown-toggle subnav" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <span class="thumbnail-wrapper d32 circular inline m-t-5">
                                        <img src="/uploads/default_user_profile_images/default_images.png" alt="logo" width="32" height="32">
                                    </span>
                                </button>
                                <ul class="navbar-nav-child dropdown-menu profile-dropdown">   
                                    <li><a href=""><i class="pg-settings_small"></i> Settings</a></li>
                                    <li><a href="#"><i class="pg-signals"></i> Help</a></li>
                                    <li class="bg-master-lighter">
                                        <span class="pull-left">
                                            <input type="hidden" name="token" id="token" value="">
                                            <button @click="$store.app.logout()" type="button" id="logout">Logout</button>
                                        </span>
                                        <span class="pull-right"><i class="pg-power"></i></span>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- END HEADER -->

        <!-- START PAGE CONTENT WRAPPER -->
        <div class="page-content-wrapper">
            <div class="content">
                <div>
                    <main id="main">            
                        <!-- Auth Login Route -->
                        <template x-if="currentRoute === 'login'">
                            <div>
                                <!-- Paste your HTML structure from auth-login.html here -->
                            </div>
                        </template>

                        <!-- Dashboard Route -->
                        <template x-if="currentRoute === 'dashboard'">
                            <div>
                                <!-- Paste your HTML structure from dashboard.html here -->
                            </div>
                        </template>

                        <!-- Customers List Route -->
                        <template x-if="currentRoute === 'customers'">
                            <div x-data="customerTable">
                                <!-- Paste your HTML structure from customer-list.html here -->
                            </div>
                        </template>

                        <!-- Customer Create Route -->
                        <template x-if="currentRoute === 'customer-create'">
                            <div>
                                <!-- Paste your HTML structure from customer-create.html here -->
                            </div>
                        </template>

                        <!-- Sale Create Route -->
                        <template x-if="currentRoute === 'sale-create'">
                            <div>
                                <!-- Paste your HTML structure from sale-create.html here -->
                            </div>
                        </template>
                    </main>
                </div>
            </div>
            <!-- END PAGE CONTENT -->

            <!-- FOOTER -->
            <div class="container-fluid container-fixed-lg footer">
                <div class="copyright sm-text-center">
                    <p class="small no-margin pull-left sm-pull-reset">
                        <span class="hint-text">Copyright © 2018 </span>
                        <span class="font-montserrat">Logic POS</span>.
                        <span class="hint-text">All rights reserved. </span>
                        <span class="sm-block"><a href="#" class="m-l-10 m-r-10">Terms of use</a> | <a href="#" class="m-l-10">Privacy Policy</a></span>
                    </p>
                    <p class="small no-margin pull-right sm-pull-reset">
                        <a href="#">Hand-crafted</a> <span class="hint-text">&amp; Made with Love ®</span>
                    </p>
                    <div class="clearfix"></div>
                </div>
            </div>
        </div>
        <!-- END PAGE CONTENT WRAPPER -->
    </div>
    <!-- END PAGE CONTAINER -->
    <!-- 1. Include jQuery Core Dependency first -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 2. Include Select2 Utility Component Engine -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
