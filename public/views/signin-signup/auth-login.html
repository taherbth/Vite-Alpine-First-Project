<div class="flex min-h-screen items-center justify-center bg-gray-100 px-4 dark:bg-gray-900" x-data="{ email: '', password: '' }">
    <div class="w-full max-w-md space-y-6 rounded-lg bg-white p-8 shadow-md dark:bg-gray-800">
        <h2 class="text-center text-3xl font-bold font-montserrat text-gray-900 dark:text-white">Sign In</h2>
        <form @submit.prevent="$store.app.handleLogin({ email, password })" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email Address</label>
                <input type="email" x-model="email" required class="mt-1 block w-full rounded border p-2 text-black" placeholder="you@company.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                <input type="password" x-model="password" required class="mt-1 block w-full rounded border p-2 text-black" placeholder="••••••••">
            </div>
            <button type="submit" :disabled="$store.app.isLoading" class="w-full rounded bg-blue-600 py-2 font-bold text-white hover:bg-blue-700 disabled:opacity-50">
                <span x-show="!$store.app.isLoading">Sign In</span>
                <span x-show="$store.app.isLoading">Processing...</span>
            </button>
        </form>
        <p class="text-center text-sm text-gray-600 dark:text-gray-400">
            Don't have an account? <a href="/signup" class="text-blue-600 hover:underline">Register here</a>
        </p>
    </div>
</div>
