<!-- views/media-gallery/media-view.html -->
<div x-data="mediaGallery" class="p-6 max-w-7xl mx-auto space-y-6 relative">

    <!-- Header Navigation -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-gray-200 dark:border-gray-700 pb-5">
        <div class="flex items-center space-x-4">
            <button @click="window.PineconeRouter ? PineconeRouter.navigate('/galleries') : history.back()" class="p-2 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            </button>
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white" x-text="activeAlbum?.title || 'Album Viewer'"></h1>
                <p class="text-sm text-gray-500 dark:text-gray-400" x-text="activeAlbum?.description || 'Browse album media items'"></p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Filter Buttons -->
            <div class="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl">
                <button @click="mediaTypeFilter = 'all'" :class="mediaTypeFilter === 'all' ? 'bg-white dark:bg-gray-700 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-gray-500'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">All</button>
                <button @click="mediaTypeFilter = 'image'" :class="mediaTypeFilter === 'image' ? 'bg-white dark:bg-gray-700 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-gray-500'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Photos</button>
                <button @click="mediaTypeFilter = 'video'" :class="mediaTypeFilter === 'video' ? 'bg-white dark:bg-gray-700 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-gray-500'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Videos</button>
            </div>

            <!-- Add Media Button -->
            <button type="button"
                    @click="openAddMediaModal()"
                    :disabled="!activeAlbum"
                    class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-lg text-xs sm:text-sm font-medium transition shadow-xs whitespace-nowrap">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span>Add media</span>
            </button>
        </div>
    </div>

    <!-- Add Media Modal -->
    <div x-show="showAddMediaModal"
         x-cloak
         class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @keydown.escape.window="if (showAddMediaModal) closeAddMediaModal()">

        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-xl max-w-xl w-full p-6 space-y-4"
             @click.outside="closeAddMediaModal()">

            <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-700 pb-3">
                <div>
                    <h3 class="text-base font-semibold text-gray-900 dark:text-white">Add media</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400">
                        Adding to <span class="font-medium text-gray-700 dark:text-gray-300" x-text="activeAlbum?.title"></span>
                    </p>
                </div>
                <button type="button" @click="closeAddMediaModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Drop Zone -->
            <label @dragover.prevent="isDragging = true"
                   @dragleave.prevent="isDragging = false"
                   @drop.prevent="isDragging = false; addNewMediaFiles($event.dataTransfer.files)"
                   :class="isDragging ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-500/10' : 'border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700/40'"
                   class="flex flex-col items-center justify-center gap-1 py-8 border-2 border-dashed rounded-xl cursor-pointer transition text-center">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Drop photos or videos here, or click to browse</span>
                <span class="text-xs text-gray-500 dark:text-gray-400" x-text="'Up to ' + maxUploadSizeMB + ' MB per file'"></span>
                <input type="file" multiple accept="image/*,video/*" class="hidden"
                       :disabled="uploadingMedia"
                       @change="addNewMediaFiles($event.target.files); $event.target.value = ''" />
            </label>

            <template x-if="addMediaError">
                <p class="text-xs text-red-500" x-text="addMediaError"></p>
            </template>

            <!-- Selected File Previews -->
            <template x-if="newMediaItems.length > 0">
                <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 max-h-64 overflow-y-auto pr-1">
                    <template x-for="(item, index) in newMediaItems" :key="item.key">
                        <div class="relative aspect-square rounded-lg bg-gray-100 dark:bg-gray-700 overflow-hidden border border-gray-200 dark:border-gray-600">
                            <template x-if="item.type === 'image'">
                                <img :src="item.url" class="w-full h-full object-cover" />
                            </template>
                            <template x-if="item.type === 'video'">
                                <video :src="item.url" class="w-full h-full object-cover" muted></video>
                            </template>
                            <button type="button" x-show="!uploadingMedia" @click="removeNewMedia(index)"
                                    class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]">✕</button>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Upload Progress -->
            <template x-if="uploadingMedia">
                <div class="space-y-1">
                    <div class="h-1.5 w-full bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-600 transition-all" :style="'width:' + uploadProgress + '%'"></div>
                    </div>
                    <p class="text-xs text-gray-500 dark:text-gray-400" x-text="'Uploading… ' + uploadProgress + '%'"></p>
                </div>
            </template>

            <div class="flex items-center justify-between gap-2 pt-3 border-t border-gray-100 dark:border-gray-700">
                <span class="text-xs text-gray-500 dark:text-gray-400"
                      x-text="newMediaItems.length + (newMediaItems.length === 1 ? ' file selected' : ' files selected')"></span>
                <div class="flex gap-2">
                    <button type="button" @click="closeAddMediaModal()" :disabled="uploadingMedia"
                            class="px-4 py-2 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition disabled:opacity-50">Cancel</button>
                    <button type="button" @click="uploadMediaToAlbum()" :disabled="uploadingMedia || newMediaItems.length === 0"
                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-xs font-medium rounded-lg transition">
                        <span x-show="!uploadingMedia">Upload to album</span>
                        <span x-show="uploadingMedia">Uploading…</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- Empty State -->
        <template x-if="activeAlbum && filteredAlbumMedia.length === 0">
            <div class="col-span-full py-12 text-center text-gray-500">
                No media items found in this gallery.
            </div>
        </template>

        <!-- Media Items -->
        <template x-for="(item, idx) in filteredAlbumMedia" :key="item.id || idx">
            <div class="group relative bg-white dark:bg-gray-900 rounded-xl overflow-hidden border border-gray-200 dark:border-gray-800 shadow-xs hover:shadow-md transition flex flex-col">
                
                <!-- Media Container (Click to open Lightbox) -->
                <div class="relative aspect-square w-full bg-gray-900 cursor-pointer overflow-hidden" @click="openLightbox(idx)">
                    <!-- Photo -->
                    <template x-if="!item.mime_type || item.mime_type.startsWith('image')">
                        <img :src="item.url" :alt="item.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
                    </template>

                    <!-- Video -->
                    <template x-if="item.mime_type && item.mime_type.startsWith('video')">
                        <div class="relative w-full h-full">
                            <video :src="item.url" class="w-full h-full object-cover pointer-events-none"></video>
                            <div class="absolute inset-0 flex items-center justify-center bg-black/20">
                                <svg class="w-10 h-10 text-white/80" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                                </svg>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Separate Bottom Action Layer -->
                <div class="p-2.5 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-100 dark:border-gray-800 flex items-center justify-between gap-2 mt-auto">
                    <!-- Media Name -->
                    <span class="text-xs truncate font-medium text-gray-700 dark:text-gray-300" x-text="item.name || 'Media File'"></span>

                    <!-- Compact Delete Button -->
                    <button type="button"
                            @click.stop.prevent="deleteMediaItem(item.gallery_id, item.id)"
                            class="w-7 h-7 shrink-0 flex items-center justify-center text-red-500 dark:text-red-400 hover:text-white bg-red-50 dark:bg-red-500/10 hover:bg-red-600 dark:hover:bg-red-600 rounded-lg transition"
                            title="Delete file">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>

            </div>
        </template>
        
    </div>

    <!-- Inline Lightbox Modal -->
    <div x-show="lightboxOpen"
         x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @keydown.window.escape="closeLightbox()"
         @keydown.window.arrow-right="nextMedia()"
         @keydown.window.arrow-left="prevMedia()"
         style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; background-color: rgba(0, 0, 0, 0.95); display: flex; align-items: center; justify-content: center;">

        <!-- Close Button -->
        <button type="button" @click="closeLightbox()" class="absolute top-5 right-5 text-white p-3 rounded-full bg-white/10 hover:bg-white/20 transition" style="z-index: 100000;">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <!-- Previous Button -->
        <button type="button" @click="prevMedia()" class="absolute left-4 text-white p-3 bg-white/10 hover:bg-white/20 rounded-full transition" style="z-index: 100000;">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <!-- Display Area -->
        <div class="max-w-5xl max-h-[85vh] w-full flex flex-col items-center justify-center p-4">
            <template x-if="currentMediaItem">
                <div class="w-full h-full flex flex-col items-center">
                    <template x-if="!currentMediaItem.mime_type || currentMediaItem.mime_type.startsWith('image')">
                        <img :src="currentMediaItem.url" class="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl" />
                    </template>
                    <template x-if="currentMediaItem.mime_type && currentMediaItem.mime_type.startsWith('video')">
                        <video :src="currentMediaItem.url" controls autoplay class="max-h-[75vh] max-w-full rounded-lg shadow-2xl"></video>
                    </template>
                    <p class="mt-4 text-gray-300 text-sm font-medium" x-text="currentMediaItem.name"></p>
                </div>
            </template>
        </div>

        <!-- Next Button -->
        <button type="button" @click="nextMedia()" class="absolute right-4 text-white p-3 bg-white/10 hover:bg-white/20 rounded-full transition" style="z-index: 100000;">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
    </div>
</div>
