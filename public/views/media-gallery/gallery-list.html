<!-- views/media-gallery/gallery-list.html -->
<div x-data="mediaGallery" class="p-6 max-w-7xl mx-auto space-y-6" @scroll.window="handleScroll($event)">
    
    <!-- Top Action Bar -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Media Gallery</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">Manage, filter, and upload multi-media assets</p>
        </div>

        <!-- Search & Filter Controls -->
        <div class="flex flex-wrap items-center gap-3">
            <!-- Search Bar -->
            <div class="relative">
                <input 
                    type="text" 
                    placeholder="Search media..." 
                    x-model.debounce.300ms="$store.app.gallery.searchQuery"
                    @input="$store.app.setSearchQuery($event.target.value)"
                    class="pl-9 pr-4 py-2 bg-gray-50 dark:bg-gray-700 text-sm border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-gray-800 dark:text-gray-100"
                />
                <svg class="w-4 h-4 absolute left-3 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <!-- Category Dropdown -->
            <select 
                x-model="$store.app.gallery.selectedCategory" 
                @change="$store.app.setCategory($event.target.value)"
                class="py-2 px-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-sm text-gray-800 dark:text-gray-100 outline-none focus:ring-2 focus:ring-blue-500 capitalize"
            >
                <template x-for="cat in $store.app.gallery.categories" :key="cat">
                    <option :value="cat" x-text="cat"></option>
                </template>
            </select>

            <!-- Layout Toggle Switch -->
            <div class="flex bg-gray-100 dark:bg-gray-700 rounded-lg p-1">
                <button 
                    @click="$store.app.gallery.layout = 'grid'" 
                    :class="$store.app.gallery.layout === 'grid' ? 'bg-white dark:bg-gray-600 shadow-xs' : 'text-gray-400'" 
                    class="p-1.5 rounded-md transition-all"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                </button>
                <button 
                    @click="$store.app.gallery.layout = 'list'" 
                    :class="$store.app.gallery.layout === 'list' ? 'bg-white dark:bg-gray-600 shadow-xs' : 'text-gray-400'" 
                    class="p-1.5 rounded-md transition-all"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Cover photo area -->
    <div  class="flex flex-col bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-xs space-y-4 w-full">
    
    <!-- Row 1: Header Title -->
    <div class="border-b border-gray-100 dark:border-gray-700 pb-3">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">New Gallery Album</h3>
    </div>

    <!-- Row 2: Form -->
    <form @submit.prevent="submitMediaGallery()" class="space-y-4 w-full">
        <!-- Title -->
        <div class="form-group form-group-default required" :class="errors.title ? 'has-error' : ''">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Album Title *</label>
            <input type="text" x-model="gallery_data.title" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:text-white" placeholder="e.g. Summer Vacation 2026" />
            <template x-if="errors.title">
                <span class="form-error text-danger" x-text="errors.title"></span>
            </template>
        </div>

        <!-- Cover Photo Upload with Image Preview -->
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cover Photo * (Max 5MB)</label>
            
            <div class="flex items-center space-x-4">
                <!-- Preview Thumbnail Box -->
                <div class="w-24 h-24 rounded-lg bg-gray-100 dark:bg-gray-700 border-2 border-dashed border-gray-300 dark:border-gray-600 overflow-hidden flex items-center justify-center flex-shrink-0">
                    <template x-if="gallery_data.coverPreviewUrl">
                        <img :src="gallery_data.coverPreviewUrl" class="w-full h-full object-cover" />
                    </template>
                    <template x-if="errors.coverFile">
                        <span class="form-error text-danger text-xs text-gray-400 text-center px-1" x-text="errors.coverFile"> </span>
                    </template>
                </div>

                <!-- Input -->
                <input type="file" accept="image/*" @change="handleCoverSelect($event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
            </div>
        </div>

        <!-- Additional Media Files with Previews -->
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Gallery Media (Images & Videos, Max 10MB each)</label>
            <input type="file" multiple accept="image/*,video/*" @change="handleGalleryMediaSelect($event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200" />

            <!-- Media Previews Grid -->
            <template x-if="gallery_data.galleryPreviews.length > 0">
                <div class="mt-3 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
                    <template x-for="(item, index) in gallery_data.galleryPreviews" :key="index">
                        <div class="relative group w-full h-24 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 overflow-hidden">
                            <!-- Image Preview -->
                            <template x-if="item.type === 'image'">
                                <img :src="item.url" class="w-full h-full object-cover" />
                            </template>

                            <!-- Video Preview -->
                            <template x-if="item.type === 'video'">
                                <video :src="item.url" class="w-full h-full object-cover" muted></video>
                            </template>

                            <!-- Remove Button Overlay -->
                            <button type="button" @click="removeGalleryMedia(index)" class="absolute top-1 right-1 bg-red-600 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity text-xs focus:outline-none">
                                ✕
                            </button>
                        </div>
                    </template>
                </div>
            </template>
        </div>
        <!-- Submit Button -->
        <button type="submit" :disabled="submitting" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition flex items-center justify-center space-x-2">
            <span x-show="!submitting">Create Album</span>
            <span x-show="submitting">Uploading Album & Cover...</span>
        </button> 
         
    </form>
</div>
   
    <!-- Media Grid View -->
    <template x-if="$store.app.gallery.layout === 'grid'">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <template x-for="(item, index) in $store.app.filteredGallery" :key="item.id || index">
                <div class="group relative bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-xs border border-gray-100 dark:border-gray-700 transition-all hover:shadow-md">
                    <!-- Thumbnail -->
                    <div class="aspect-square w-full bg-gray-100 dark:bg-gray-900 overflow-hidden cursor-pointer" @click="$store.app.openLightbox(index)">
                        <template x-if="item.mime_type && item.mime_type.startsWith('video')">
                            <video :src="item.url" class="w-full h-full object-cover"></video>
                        </template>
                        <template x-if="!item.mime_type || !item.mime_type.startsWith('video')">
                            <img :src="item.url || item.thumbnail" :alt="item.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
                        </template>
                    </div>

                    <!-- Actions Overlay -->
                    <div class="absolute inset-x-0 bottom-0 p-3 bg-gradient-to-t from-black/70 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex justify-between items-center text-white">
                        <span class="text-xs truncate max-w-[70%]" x-text="item.title || 'Untitled'"></span>
                        <button @click.stop="$store.app.deleteMedia(item.id)" class="text-red-400 hover:text-red-300 p-1 rounded-md transition-colors" title="Delete">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <!-- Media List View -->
    <template x-if="$store.app.gallery.layout === 'list'">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xs border border-gray-100 dark:border-gray-700 divide-y divide-gray-100 dark:divide-gray-700">
            <template x-for="(item, index) in $store.app.filteredGallery" :key="item.id || index">
                <div class="p-3 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors">
                    <div class="flex items-center space-x-3 cursor-pointer" @click="$store.app.openLightbox(index)">
                        <img :src="item.url || item.thumbnail" class="w-12 h-12 object-cover rounded-lg bg-gray-100" />
                        <div>
                            <p class="text-sm font-medium text-gray-800 dark:text-gray-200" x-text="item.title || 'Untitled'"></p>
                            <p class="text-xs text-gray-400" x-text="item.category || 'General'"></p>
                        </div>
                    </div>
                    <button @click="$store.app.deleteMedia(item.id)" class="text-gray-400 hover:text-red-500 p-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            </template>
        </div>
    </template>

    <!-- Lightbox Modal -->
    <div x-show="$store.app.gallery.lightboxOpen" 
         x-transition:enter="transition ease-out duration-200" 
         x-transition:enter-start="opacity-0" 
         x-transition:enter-end="opacity-100" 
         class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
         
        <!-- Close Button -->
        <button @click="$store.app.closeLightbox()" class="absolute top-4 right-4 text-white hover:text-gray-300 p-2">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <!-- Previous Button -->
        <button @click="$store.app.prevMedia()" class="absolute left-4 text-white hover:text-gray-300 p-2">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <!-- Lightbox Content -->
        <div class="max-w-4xl max-h-[85vh] flex flex-col items-center">
            <template x-if="$store.app.filteredGallery[$store.app.gallery.activeMediaIndex]">
                <img :src="$store.app.filteredGallery[$store.app.gallery.activeMediaIndex].url" 
                     class="max-h-[80vh] max-w-full object-contain rounded-lg" />
            </template>
        </div>

        <!-- Next Button -->
        <button @click="$store.app.nextMedia()" class="absolute right-4 text-white hover:text-gray-300 p-2">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
    </div>
</div>
