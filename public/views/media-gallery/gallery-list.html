<!-- views/media-gallery/gallery-list.html -->
<div x-data="mediaGallery" class="p-4 sm:p-6 max-w-7xl mx-auto space-y-6">

    <!-- Top Action & Search Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-xs border border-gray-100 dark:border-gray-700">
        <div>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Media Albums</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400">Manage and upload multi-media collections</p>
        </div>

        <div class="flex items-center gap-3">
            <!-- Search Bar -->
            <div class="relative flex-1 sm:flex-initial">
                <input 
                    type="text" 
                    placeholder="Search albums..." 
                    x-model.debounce.300ms="search"
                    @input="fetchGallery()"
                    class="w-full pl-9 pr-3 py-1.5 bg-gray-50 dark:bg-gray-700 text-xs sm:text-sm border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-gray-800 dark:text-gray-100"
                />
                <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>

            <!-- Create Modal Button -->
            <button 
                @click="showCreateModal = true" 
                class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs sm:text-sm font-medium transition shadow-xs whitespace-nowrap"
            >
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span>New Album</span>
            </button>
        </div>
    </div>

    <!-- Fixed Create Modal Overlay -->
    <div 
        x-show="showCreateModal" 
        x-cloak
        class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @keydown.escape.window="showCreateModal = false"
    >
        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-xl max-w-lg w-full p-6 space-y-4" @click.away="showCreateModal = false">
            <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-700 pb-3">
                <h3 class="text-base font-semibold text-gray-900 dark:text-white">Create New Gallery Album</h3>
                <button @click="showCreateModal = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form @submit.prevent="submitMediaGallery()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Album Title *</label>
                    <input type="text" x-model="gallery_data.title" placeholder="e.g. Summer Vacation 2026" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg text-sm dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" />
                    <template x-if="errors.title">
                        <span class="text-xs text-red-500 mt-1 block" x-text="errors.title"></span>
                    </template>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Cover Image *</label>
                    <div class="flex items-center gap-3">
                        <div class="w-16 h-16 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 overflow-hidden flex items-center justify-center shrink-0">
                            <template x-if="gallery_data.coverPreviewUrl">
                                <img :src="gallery_data.coverPreviewUrl" class="w-full h-full object-cover" />
                            </template>
                            <template x-if="!gallery_data.coverPreviewUrl">
                                <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                            </template>
                        </div>
                        <input type="file" accept="image/*" @change="handleCoverSelect($event)" class="text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                    </div>
                    <template x-if="errors.coverFile">
                        <span class="text-xs text-red-500 mt-1 block" x-text="errors.coverFile"></span>
                    </template>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Gallery Media Files</label>
                    <input type="file" multiple accept="image/*,video/*" @change="handleGalleryMediaSelect($event)" class="text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200" />
                    
                    <template x-if="gallery_data.galleryPreviews && gallery_data.galleryPreviews.length > 0">
                        <div class="mt-3 grid grid-cols-4 gap-2">
                            <template x-for="(item, index) in gallery_data.galleryPreviews" :key="index">
                                <div class="relative group aspect-square rounded-lg bg-gray-100 overflow-hidden border border-gray-200">
                                    <template x-if="item.type === 'image'">
                                        <img :src="item.url" class="w-full h-full object-cover" />
                                    </template>
                                    <template x-if="item.type === 'video'">
                                        <video :src="item.url" class="w-full h-full object-cover" muted></video>
                                    </template>
                                    <button type="button" @click="removeGalleryMedia(index)" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]">✕</button>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-gray-100 dark:border-gray-700">
                    <button type="button" @click="showCreateModal = false" class="px-4 py-2 text-xs text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition">Cancel</button>
                    <button type="submit" :disabled="submitting" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg transition flex items-center gap-1.5">
                        <span x-show="!submitting">Publish Album</span>
                        <span x-show="submitting">Processing...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- Album Grid Display -->
    <template x-if="paginated.length > 0">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
            <template x-for="album in paginated" :key="album.id">
                <div class="group relative bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-xs border border-gray-100 dark:border-gray-700/80 transition hover:shadow-md flex flex-col justify-between">
                    <div class="aspect-4/3 w-full bg-gray-100 dark:bg-gray-900 overflow-hidden relative cursor-pointer" @click="openAlbumView(album)">
                       <img 
                            :src="album.cover_photo_url ? album.cover_photo_url.replace(/\.$/, '') : 'https://placehold.co/600x400?text=No+Cover'" 
                            :alt="album.title || 'Album Cover'" 
                            class="w-full h-full object-cover group-hover:scale-105 transition duration-300" 
                            loading="lazy" 
                            @error="if ($event.target.src !== 'https://placehold.co/600x400?text=No+Cover') { $event.target.src = 'https://placehold.co/600x400?text=No+Cover'; }"
                        />
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-xs px-2 py-0.5 rounded-full text-[10px] text-white">
                            <span x-text="(album.media ? album.media.length : 0) + ' items'"></span>
                        </div>
                    </div>
                    <div class="p-3.5 flex items-center justify-between">
                        <div>
                            <h3 class="text-sm font-semibold text-gray-900 dark:text-white truncate cursor-pointer hover:text-indigo-600" @click="openAlbumView(album)" x-text="album.title"></h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate mt-0.5" x-text="album.description || 'No description'"></p>
                        </div>
                        <button @click="deleteAlbum(album.id)" class="text-gray-400 hover:text-red-500 p-1 transition" title="Delete Album">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <!-- Empty State -->
    <template x-if="paginated.length === 0 && !$store.app.isLoading">
        <div class="text-center py-12 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-200 dark:border-gray-700">
            <svg class="w-10 h-10 text-gray-300 dark:text-gray-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="text-gray-500 dark:text-gray-400 text-xs font-medium">No albums found. Click "New Album" to get started.</p>
        </div>
    </template>
</div>
